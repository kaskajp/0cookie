name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler-cache: true
          working-directory: server
      - name: Lint (Rubocop)
        run: bundle exec rubocop --version || true
      - name: Security (Brakeman)
        run: bundle exec brakeman --no-pager --quiet || true
      - name: Run tests
        run: bundle exec rails test



services:
  web:
    build:
      context: ./server
    environment:
      - RAILS_ENV=development
      - PORT=3000
      - SMTP_ADDRESS=mailhog
      - SMTP_PORT=1025
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
    command: bundle exec puma -p 3000 -b tcp://0.0.0.0

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"

